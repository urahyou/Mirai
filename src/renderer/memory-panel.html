<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8" /><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" /><title>小未来 · 记忆库</title><link rel="stylesheet" href="theme.css" /><link rel="stylesheet" href="panel.css" /><link rel="stylesheet" href="memory-panel.css" /><style>.hidden{display:none}.graph-scene{min-height:100%}.graph-stage{position:relative;min-height:360px;overflow:hidden;border:1px dashed var(--line-strong);background:repeating-linear-gradient(0deg,transparent 0 27px,rgba(92,139,186,.12) 28px),#fffaf0}.graph-stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.graph-edge{stroke:var(--line-strong);stroke-width:1.4;opacity:.76}.graph-node{position:absolute;z-index:1;max-width:110px;min-width:52px;padding:5px 7px;border:1px solid var(--mint-deep);border-radius:0;color:var(--ink);background:#fffdf2;box-shadow:2px 2px 0 rgba(131,95,156,.16);font-size:10px;line-height:1.25;overflow-wrap:anywhere;transform:translate(-50%,-50%)}.graph-node:hover,.graph-node.active{color:#fff;background:var(--mint-deep)}.graph-note{margin:12px 0 0;color:var(--muted);font-size:11px;line-height:1.55}</style></head>
<body><div id="app">
  <header class="panel-header"><div class="title-line"><div><h1 class="panel-title">小未来的记忆库</h1><p class="panel-desc">全量对话、语义片段、事实关系，以及她没有说出口的心事。</p></div><span class="core-status" id="statusBox">正在连接…</span></div></header>
  <main class="reader-shell"><section class="reader-view"><aside class="entry-list" aria-label="记忆类别"><div class="list-heading"><span>Memory Index</span><strong id="memoryCount">0 条</strong></div><div class="memory-tabs" id="memoryTabs">
    <button class="memory-tab active" data-kind="messages" type="button">全量对话</button><button class="memory-tab" data-kind="episodes" type="button">相处片段</button><button class="memory-tab" data-kind="vectors" type="button">向量记忆</button><button class="memory-tab" data-kind="facts" type="button">事实</button><button class="memory-tab" data-kind="graph" type="button">图谱</button><button class="memory-tab" data-kind="edges" type="button">图关系</button><button class="memory-tab" data-kind="profiles" type="button">人格画像</button><button class="memory-tab" data-kind="thoughts" type="button">内心活动</button><button class="memory-tab" data-kind="dreams" type="button">梦境</button><button class="memory-tab" data-kind="reflections" type="button">反思</button><button class="memory-tab" data-kind="events" type="button">事件</button>
  </div><div class="entry-scroll" id="memoryList"></div></aside><article class="memory-detail" aria-live="polite"><div id="memoryReader"><p class="detail-kicker" id="memoryKicker">Memory</p><h2 id="memoryTitle">选择一条记忆</h2><div class="detail-rule"></div><div class="memory-body" id="memoryBody">这里会显示原文、心理状态或关系证据。</div><dl class="memory-meta" id="memoryMeta"></dl></div><section class="graph-scene hidden" id="graphScene" aria-label="记忆关系图"><p class="detail-kicker">Memory Graph</p><h2 id="graphTitle">关系图谱</h2><div class="detail-rule"></div><div class="graph-stage" id="graphStage" aria-label="关系节点图"></div><p class="graph-note" id="graphNote"></p></section></article></section></main>
  <footer class="panel-footer"><span class="hint" id="statsLine">只读浏览，不会改写本地记忆。</span><div class="spacer"></div><button class="btn small ghost" id="refreshBtn" type="button" title="刷新记忆">↻</button><button class="btn small ghost" id="closeBtn" type="button">关闭</button></footer>
</div><script src="memory-panel.js"></script></body></html>
