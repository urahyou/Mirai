<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>小未来 · 本地记忆</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="panel.css" />
  <style>
    .memory-content { display: grid; gap: 10px; overflow-y: auto; padding: 16px 0; }
    .memory-section { display: grid; gap: 8px; padding: 13px; border: 1px solid var(--line); background: var(--paper); }
    .memory-section h2 { margin: 0; color: var(--pink-deep); font-size: 13px; }
    .memory-section p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .status { padding: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--muted); font-size: 12px; line-height: 1.6; }
    .status.ok { color: var(--success); }
    .status.bad { color: var(--danger); }
  </style>
</head>
<body>
  <div id="app">
    <header class="panel-header">
      <h1 class="panel-title">本地记忆库</h1>
      <p class="panel-desc">记忆保存在本机 SQLite，支持聊天情景、事实、关系图和日记来源追踪。</p>
    </header>
    <main class="memory-content">
      <div class="status" id="statusBox">正在检查本地记忆库…</div>
      <section class="memory-section">
        <h2>当前能力</h2>
        <p>SQLite 本地存储 · 关键词检索 · 关系图检索 · 来源级遗忘</p>
        <p id="statsLine">正在读取数据统计…</p>
      </section>
      <section class="memory-section">
        <h2>数据边界</h2>
        <p>聊天、互动、虚拟生活和日记素材留在本机；未启用向量服务，不启动 Docker 或网络记忆侧车。</p>
      </section>
    </main>
    <footer class="panel-footer">
      <span class="hint">Python Core 未就绪时不会读取或写入长期记忆。</span>
      <div class="spacer"></div>
      <button class="btn small ghost" id="closeBtn" type="button">关闭</button>
    </footer>
  </div>
  <script src="memory-panel.js"></script>
</body>
</html>
