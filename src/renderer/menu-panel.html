<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>小未来 · 菜单</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    #menu {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.97);
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.12);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      padding: 6px;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 79, 158, 0.5) transparent;
    }
    #menu::-webkit-scrollbar { width: 8px; }
    #menu::-webkit-scrollbar-thumb { background: rgba(255, 79, 158, 0.4); border-radius: 4px; }
    #menu::-webkit-scrollbar-track { background: transparent; }
    .menu-title {
      padding: 4px 10px;
      font-size: 11px;
      color: #999;
      cursor: grab;
      flex-shrink: 0;
    }
    .menu-title.dragging { cursor: grabbing; }
    .menu-item {
      width: 100%;
      padding: 7px 30px 7px 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      color: #333;
      font: inherit;
      text-align: left;
      white-space: nowrap;
      flex-shrink: 0;
      position: relative;
    }
    .menu-item:hover { background: rgba(255, 122, 184, 0.2); }
    .menu-item.checked::before { content: '✓ '; color: #ff4f9e; }
    .menu-item.active { color: #ff4f9e; font-weight: 600; }
    .menu-separator { height: 1px; background: rgba(0, 0, 0, 0.1); margin: 5px 8px; flex-shrink: 0; }
    .menu-sub-label { cursor: pointer; }
    .menu-item.menu-sub-label::after { content: '▸'; position: absolute; right: 10px; color: #bbb; font-size: 10px; }
    .menu-sub-wrap .menu-item { font-weight: 400; }
    .menu-sub-wrap { display: none; padding-left: 10px; }
    .menu-sub-wrap.show { display: block; }
  </style>
</head>
<body>
  <div id="menu"></div>
  <script src="menu-panel.js"></script>
</body>
</html>
