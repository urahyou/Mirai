<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>小未来 · 语音设置</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="panel.css" />
  <link rel="stylesheet" href="display-panel.css" />
  <style>
    .select-row { display: flex; flex-direction: column; gap: 5px; }
    .select-label { font-size: 13px; font-weight: 600; }
    .select {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid rgba(0,0,0,.14);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }
    .select:focus-visible { outline: 2px solid var(--pink-soft); outline-offset: 1px; }
    .ref-note { margin-top: 2px; font-size: 11px; color: var(--muted); word-break: break-all; line-height: 1.4; }
  </style>
</head>
<body>
  <div id="app">
    <header class="panel-header">
      <h1 class="panel-title">语音设置</h1>
      <p class="panel-desc">选择小未来怎么说话、用什么音色</p>
      <p class="save-status" id="saveStatus" aria-live="polite"></p>
    </header>

    <main class="settings-content">
      <section class="setting-section">
        <label class="toggle-row" for="ttsEnabled">
          <span>
            <span class="toggle-title">朗读回复声音</span>
            <span class="hint">关闭后小未来只显示文字气泡，不发声（语音输入仍可用）</span>
          </span>
          <span class="switch">
            <input id="ttsEnabled" type="checkbox" />
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          </span>
        </label>
      </section>

      <section class="setting-section">
        <div class="select-row">
          <label class="select-label" for="speakLang">朗读语言</label>
          <select id="speakLang" class="select">
            <option value="">跟随回复（中文文字，中文发音）</option>
            <option value="ja">日语朗读（屏幕显示中文，语音说日语）</option>
            <option value="en">英语朗读（屏幕显示中文，语音说英语）</option>
          </select>
          <span class="ref-note">选“日语/英语”时，小未来会把中文回复翻译成对应语言再朗读，气泡仍显示中文。</span>
        </div>
      </section>

      <section class="setting-section">
        <div class="select-row">
          <label class="select-label" for="ttsEngine">音色引擎</label>
          <select id="ttsEngine" class="select">
            <option value="edge">Edge 云端音色（需联网）</option>
            <option value="gpt-sovits">GPT-SoVITS 本地音色克隆（离线，需先启动服务）</option>
          </select>
        </div>
        <span class="ref-note" id="refNote"></span>
      </section>
    </main>

    <footer class="panel-footer">
      <span class="hint" id="saveHint" aria-live="polite"></span>
      <div class="spacer"></div>
      <button class="btn small ghost" id="resetBtn" type="button">恢复默认</button>
      <button class="btn ghost" id="closeBtn" type="button">关闭</button>
    </footer>
  </div>

  <script src="voice-settings.js"></script>
</body>
</html>
