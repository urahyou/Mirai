<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>小未来 · 显示设置</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="panel.css" />
  <link rel="stylesheet" href="display-panel.css" />
</head>
<body>
  <div id="app">
    <header class="panel-header">
      <h1 class="panel-title">显示设置</h1>
      <p class="panel-desc">调整小未来在桌面上的大小和显示方式</p>
      <p class="save-status" id="saveStatus" aria-live="polite"></p>
    </header>

    <main class="settings-content">
      <section class="setting-section" id="petStateSection" style="display:block">
        <div class="setting-heading">
          <div>
            <h2 class="section-title">小未来的状态</h2>
            <p class="hint">随互动与真实时间的流逝而变化</p>
          </div>
          <span class="chip" id="stageChip">幼年</span>
        </div>
        <div class="stat-grid" id="statGrid">
          <div class="stat" title="心情"><span class="stat-label">心情</span><strong class="stat-value" id="sMood">—</strong></div>
          <div class="stat" title="好感"><span class="stat-label">好感</span><strong class="stat-value" id="sAffection">—</strong></div>
          <div class="stat" title="体力"><span class="stat-label">体力</span><strong class="stat-value" id="sEnergy">—</strong></div>
          <div class="stat" title="压力"><span class="stat-label">压力</span><strong class="stat-value" id="sStress">—</strong></div>
          <div class="stat" title="孤独"><span class="stat-label">孤独</span><strong class="stat-value" id="sLoneliness">—</strong></div>
          <div class="stat" title="健康"><span class="stat-label">健康</span><strong class="stat-value" id="sHealth">—</strong></div>
        </div>
        <div class="exp-row">
          <span class="exp-label" id="stageLabel">成长经验</span>
          <div class="exp-track"><div class="exp-fill" id="expFill"></div></div>
          <span class="exp-num" id="stageExp">0</span>
        </div>
      </section>

      <section class="setting-section">
        <div class="setting-heading">
          <div>
            <h2 class="section-title">角色大小</h2>
            <p class="hint">窗口和 Live2D 会同步缩放</p>
          </div>
          <strong class="value" id="scaleValue">100%</strong>
        </div>
        <input id="scaleRange" class="scale-range" type="range" min="70" max="150" step="5" value="100" />
        <div class="range-labels"><span>70%</span><span>100%</span><span>150%</span></div>
      </section>

      <section class="setting-section">
        <label class="toggle-row" for="alwaysOnTop">
          <span>
            <span class="toggle-title">始终置顶</span>
            <span class="hint">关闭后，小未来会像普通窗口一样被其他应用覆盖</span>
          </span>
          <span class="switch">
            <input id="alwaysOnTop" type="checkbox" />
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          </span>
        </label>
      </section>

      <section class="setting-section">
        <label class="toggle-row" for="outlineShadow">
          <span>
            <span class="toggle-title">角色轮廓阴影</span>
            <span class="hint">给 Live2D 轮廓添加柔和的粉色外阴影</span>
          </span>
          <span class="switch">
            <input id="outlineShadow" type="checkbox" />
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          </span>
        </label>
      </section>

      <section class="setting-section">
        <div class="setting-heading">
          <div>
            <h2 class="section-title">气泡显示时长</h2>
            <p class="hint">聊天泡泡停留多久后消失；选「自动」则按文字长短智能调整（2.6~7.6 秒）</p>
          </div>
          <strong class="value" id="bubbleValue">自动</strong>
        </div>
        <input id="bubbleRange" class="scale-range" type="range" min="0" max="30" step="1" value="0" />
        <div class="range-labels"><span>自动</span><span>15s</span><span>30s</span></div>
      </section>

      <section class="setting-section">
        <label class="toggle-row" for="voiceDockAutoHide">
          <span>
            <span class="toggle-title">扇形面板自动消失</span>
            <span class="hint">单击角色弹出的语音控制面板（🎤/🔊）闲置后自动收起，避免一直挂在桌面上</span>
          </span>
          <span class="switch">
            <input id="voiceDockAutoHide" type="checkbox" />
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          </span>
        </label>
      </section>

      <section class="setting-section" id="dockHideSecSection">
        <div class="setting-heading">
          <div>
            <h2 class="section-title">扇形面板消失时长</h2>
            <p class="hint">面板打开后多少秒自动收起（仅开启“自动消失”时生效）</p>
          </div>
          <strong class="value" id="dockHideValue">6s</strong>
        </div>
        <input id="dockHideRange" class="scale-range" type="range" min="3" max="30" step="1" value="6" />
        <div class="range-labels"><span>3s</span><span>15s</span><span>30s</span></div>
      </section>

      <section class="setting-section">
        <div class="setting-heading">
          <div>
            <h2 class="section-title">小未来的生活</h2>
            <p class="hint">她正在感知你的电脑，并每天自己写日记</p>
          </div>
        </div>
        <div class="sensing-row" id="awareLine">正在感知…</div>
        <div class="diary-box" id="diaryBox">
          <div class="diary-head">
            <strong class="diary-date" id="diaryDate">今天的日记</strong>
            <button class="btn tiny ghost" id="diaryOpenBtn" type="button">打开日记文件夹</button>
          </div>
          <pre class="diary-text" id="diaryText">（今天还没有日记，试着和她说说话吧）</pre>
        </div>
      </section>
    </main>

    <footer class="panel-footer">
      <span class="hint" id="saveHint" aria-live="polite"></span>
      <div class="spacer"></div>
      <button class="btn small ghost" id="resetBtn" type="button">恢复默认</button>
      <button class="btn ghost" id="closeBtn" type="button">关闭</button>
    </footer>
  </div>

  <script src="display-panel.js"></script>
</body>
</html>
