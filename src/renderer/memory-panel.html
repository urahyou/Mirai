<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>小未来 · 记忆库</title>
  <link rel="stylesheet" href="settings-panel.css" />
  <link rel="stylesheet" href="memory-panel.css" />
</head>
<body>
  <header class="mp-head">
    <span class="mp-title">记忆库</span>
    <span class="mp-sub" id="mp-count-sub">—</span>
  </header>

  <!-- 分区 Tab -->
  <nav class="mp-tabs" id="mp-tabs">
    <button class="mp-tab active" data-lay="core">常驻画像</button>
    <button class="mp-tab" data-lay="active">活跃记忆</button>
    <button class="mp-tab" data-lay="trash">回收站</button>
    <button class="mp-tab" data-lay="all">全部</button>
  </nav>

  <!-- 工具栏 -->
  <div class="mp-toolbar">
    <input class="mp-search" id="mp-search" placeholder="搜索记忆…" />
    <button class="btn small" id="mp-hygiene-btn" title="扫描出值得处理的记忆">清理建议<span id="mp-hygiene-count" class="badge"></span></button>
    <button class="btn small ghost" id="mp-export">导出</button>
  </div>

  <!-- 清理建议面板 -->
  <div class="mp-hygiene" id="mp-hygiene" hidden>
    <div class="mp-hygiene-title">清理建议（仅建议，删除将进入回收站）</div>
    <div id="mp-hygiene-rows"></div>
    <button class="btn small" id="mp-hygiene-archive-all">一键归档全部</button>
  </div>

  <!-- 自动记忆设置 -->
  <div class="mp-auto">
    <label class="mp-switch">
      <span>自动沉淀记忆</span>
      <input type="checkbox" id="mp-auto-switch" checked />
    </label>
    <select id="mp-auto-interval" class="mp-interval" title="沉淀频率">
      <option value="300000">5 分钟</option>
      <option value="1800000">30 分钟</option>
      <option value="3600000">1 小时</option>
    </select>
  </div>

  <!-- 记忆列表 -->
  <main class="mp-list" id="mp-list"></main>

  <!-- 最近沉淀日志 -->
  <details class="mp-log">
    <summary>最近沉淀日志</summary>
    <div id="mp-log-rows" class="mp-log-rows"></div>
  </details>

  <script src="memory-panel.js"></script>
</body>
</html>
