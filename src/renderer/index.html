<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- pixi-live2d-display compiles Cubism motions dynamically; it requires unsafe-eval. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>伪春菜桌宠</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="pet">
    <!-- 对话气泡 -->
    <div id="balloon" class="hidden">
      <div id="balloon-text"></div>
      <div class="balloon-tail"></div>
    </div>

    <!-- Live2D 角色；PNG 在模型或 WebGL 加载失败时作为回退显示。 -->
    <div id="character">
      <div id="character-live2d" aria-hidden="true">
        <canvas id="character-canvas"></canvas>
      </div>
      <img id="character-img" src="../../assets/character/idle.png" draggable="false" />
      <div id="character-shadow"></div>
    </div>

  </div>

  <script src="../../assets/live2d/runtime/live2dcubismcore.min.js"></script>
  <script src="../../node_modules/pixi.js/dist/browser/pixi.min.js"></script>
  <script src="../../node_modules/pixi-live2d-display/dist/cubism4.min.js"></script>
  <script src="live2d-avatar.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
