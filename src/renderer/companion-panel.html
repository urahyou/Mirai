<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>小未来 · 相处</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="panel.css" />
  <link rel="stylesheet" href="display-panel.css" />
</head>
<body>
  <div id="app">
    <div class="drag-bar" title="按住拖动移动窗口">
      <span class="drag-grip">⠿⠿</span>
      <span class="drag-title">与小未来相处</span>
      <span class="drag-tip">· 按住此条拖动窗口</span>
      <button class="drag-close" id="dragClose" type="button" aria-label="关闭">✕</button>
    </div>
    <header class="panel-header">
      <h1 class="panel-title">与小未来相处</h1>
      <p class="panel-desc">她的心情、成长与生活</p>
    </header>

    <main class="settings-content">
      <section class="setting-section" style="display:block">
        <div class="setting-heading">
          <div><h2 class="section-title">心情与状态</h2><p class="hint">随互动与真实时间的流逝而变化</p></div>
          <span class="chip" id="stageChip">幼年</span>
        </div>
        <div class="stat-grid">
          <div class="stat" title="心情"><span class="stat-label">心情</span><strong class="stat-value" id="sMood">—</strong></div>
          <div class="stat" title="好感"><span class="stat-label">好感</span><strong class="stat-value" id="sAffection">—</strong></div>
          <div class="stat" title="体力"><span class="stat-label">体力</span><strong class="stat-value" id="sEnergy">—</strong></div>
          <div class="stat" title="压力"><span class="stat-label">压力</span><strong class="stat-value" id="sStress">—</strong></div>
          <div class="stat" title="孤独"><span class="stat-label">孤独</span><strong class="stat-value" id="sLoneliness">—</strong></div>
          <div class="stat" title="健康"><span class="stat-label">健康</span><strong class="stat-value" id="sHealth">—</strong></div>
        </div>
        <div class="exp-row">
          <span class="exp-label" id="stageLabel">成长经验</span>
          <div class="exp-track"><div class="exp-fill" id="expFill"></div></div>
          <span class="exp-num" id="stageExp">0</span>
        </div>
      </section>

      <section class="setting-section">
        <div class="setting-heading"><div><h2 class="section-title">怎么让她更喜欢你</h2><p class="hint">好感与经验会随相处自动增长，不用手动"喂"</p></div></div>
        <ul class="help-list">
          <li>💬 多和她<strong>聊天</strong> —— 每次对话都会增加好感与经验</li>
          <li>👋 点点她 —— 点击角色打招呼也会让她开心</li>
          <li>🧊 别冷落太久 —— 长时间不理她会让她有点失落</li>
        </ul>
      </section>

      <section class="setting-section">
        <div class="setting-heading"><div><h2 class="section-title">她眼里的当下</h2><p class="hint">每种来源可独立关闭与清除</p></div></div>
        <div class="sensing-row" id="awareLine">正在感知…</div>
        <div class="perception-list" id="perceptionList" aria-live="polite"></div>
      </section>

      <section class="setting-section">
        <div class="setting-heading"><div><h2 class="section-title">她的日记</h2><p class="hint">日记册是独立入口，不和记忆库混在一起</p></div></div>
        <button class="btn primary" id="diaryOpenBtn" type="button">📖 打开日记册</button>
      </section>
    </main>

    <footer class="panel-footer">
      <button class="btn small ghost" id="backBtn" type="button">← 设置中心</button>
      <div class="spacer"></div>
      <button class="btn ghost" id="closeBtn" type="button">关闭</button>
    </footer>
  </div>
  <script src="companion-panel.js"></script>
</body>
</html>
