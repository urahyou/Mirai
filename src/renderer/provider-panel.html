<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>小未来 · 模型连接</title>
  <link rel="stylesheet" href="provider-panel.css" />
</head>
<body>
  <main id="app">
    <header class="topbar">
      <h1>模型设置</h1>
      <span class="protocol">OpenAI Compatible</span>
    </header>

    <div class="workspace">
      <aside class="sidebar" aria-label="Provider 列表">
        <div class="sidebar-head">
          <span>模型列表</span>
          <button id="add" class="icon-button" type="button" title="新建 Provider">＋</button>
        </div>
        <nav id="provider-list" class="provider-list"></nav>
      </aside>

      <section id="editor" class="editor" aria-live="polite"></section>
    </div>

    <footer class="footer">
      <span id="status" aria-live="polite"></span>
      <div class="spacer"></div>
      <button id="close" type="button" class="secondary">关闭</button>
      <button id="save" type="button" class="primary">保存更改</button>
    </footer>
  </main>
  <script src="provider-panel.js"></script>
</body>
</html>
