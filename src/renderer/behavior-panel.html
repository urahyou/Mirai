<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>小未来 · 桌面行为</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="panel.css" />
  <link rel="stylesheet" href="display-panel.css" />
</head>
<body>
  <div id="app">
    <div class="drag-bar" title="按住拖动移动窗口">
      <span class="drag-grip">⠿⠿</span>
      <span class="drag-title">桌面行为</span>
      <span class="drag-tip">· 按住此条拖动窗口</span>
      <button class="drag-close" id="dragClose" type="button" aria-label="关闭">✕</button>
    </div>
    <header class="panel-header">
      <h1 class="panel-title">桌面行为</h1>
      <p class="panel-desc">小未来在桌面上怎么待着</p>
    </header>

    <main class="settings-content">
      <section class="setting-section">
        <label class="toggle-row" for="alwaysOnTop">
          <span><span class="toggle-title">始终置顶</span><span class="hint">关闭后，小未来会像普通窗口一样被其他应用覆盖</span></span>
          <span class="switch"><input id="alwaysOnTop" type="checkbox" /><span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span></span>
        </label>
      </section>

      <section class="setting-section">
        <label class="toggle-row" for="voiceDockAutoHide">
          <span><span class="toggle-title">扇形面板自动消失</span><span class="hint">单击角色弹出的语音控制面板闲置后自动收起</span></span>
          <span class="switch"><input id="voiceDockAutoHide" type="checkbox" /><span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span></span>
        </label>
      </section>

      <section class="setting-section" id="dockHideSecSection">
        <div class="setting-heading">
          <div><h2 class="section-title">扇形面板消失时长</h2><p class="hint">面板打开后多少秒自动收起（仅开启"自动消失"时生效）</p></div>
          <strong class="value" id="dockHideValue">6s</strong>
        </div>
        <input id="dockHideRange" class="scale-range" type="range" min="3" max="30" step="1" value="6" />
        <div class="range-labels"><span>3s</span><span>15s</span><span>30s</span></div>
      </section>
    </main>

    <footer class="panel-footer">
      <button class="btn small ghost" id="backBtn" type="button">← 设置中心</button>
      <div class="spacer"></div>
      <span class="hint" id="saveHint" aria-live="polite"></span>
      <button class="btn ghost" id="closeBtn" type="button">关闭</button>
    </footer>
  </div>
  <script src="behavior-panel.js"></script>
</body>
</html>
